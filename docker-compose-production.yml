
services:
  docker-guardian:
    image: gitea.tmayt.ir/thaiostream/docker-guardian:latest
    container_name: docker-guardian
    restart: unless-stopped
    
    # Allows psutil to see the actual host machine's CPU and memory usage
    pid: "host"
    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - .env
      
    volumes:
      # CRITICAL: Allows the app to interact with the host's Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Host filesystem for accurate free-disk reporting
      - /:/host:ro
      # Optional: Persist logs on the host system
      - ./logs:/app/logs
      - ./data:/app/data

    # Optional: You can pre-configure your thresholds here
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CPU_THRESHOLD=${CPU_THRESHOLD:-80}
      - RAM_THRESHOLD=${RAM_THRESHOLD:-80}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}
      - CPU_HIGH_STREAK=${CPU_HIGH_STREAK:-3}
      - METRICS_INTERVAL=${METRICS_INTERVAL:-10}
      - CONTAINER_STATS_EVERY=${CONTAINER_STATS_EVERY:-2}
      - LOG_FILE=logs/guardian.log
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - START_NOTIFICATION_CURL=${START_NOTIFICATION_CURL}
      - STOP_NOTIFICATION_CURL=${STOP_NOTIFICATION_CURL}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - DISK_PATH=${DISK_PATH:-/host}
