<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود — Docker Guardian</title>
<style>
  :root {
    --bg: #070b12;
    --surface: #0f1726;
    --border: #1c2a40;
    --accent: #22c55e;
    --accent-dim: rgba(34, 197, 94, 0.15);
    --danger: #ef4444;
    --text: #e8eef7;
    --muted: #7b8ba5;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(34, 197, 94, 0.12), transparent 55%),
      radial-gradient(900px 500px at -10% 110%, rgba(59, 130, 246, 0.1), transparent 50%),
      linear-gradient(165deg, #05080f 0%, #0a1220 45%, #070b12 100%);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .shell {
    width: min(420px, 100%);
    animation: rise 0.45s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .brand {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand-icon {
    width: 56px; height: 56px;
    margin: 0 auto 14px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 26px;
    background: linear-gradient(145deg, #16a34a, #0ea5e9);
    box-shadow: 0 10px 30px rgba(34, 197, 94, 0.25);
  }
  .brand h1 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand p {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .card {
    background: rgba(15, 23, 38, 0.92);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 24px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }
  .field { margin-bottom: 16px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #0a1220;
    color: var(--text);
    font-size: 1rem;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .error {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #fecaca;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 13px 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #04110a;
    font-weight: 700;
    font-size: 0.95rem;
    font-family: var(--sans);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
  }
  button:hover { transform: translateY(-1px); opacity: 0.95; }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <h1>Docker Guardian</h1>
      <p>ورود امن به داشبورد مانیتورینگ</p>
    </div>
    <form class="card" method="post" action="/login" autocomplete="on">
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <div class="field">
        <label for="username">نام کاربری</label>
        <input id="username" name="username" type="text" required autofocus autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit">ورود به داشبورد</button>
    </form>
  </div>
</body>
</html>
